services:
  - type: web
    name: galbaat-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://galbaat-sable.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://galbaat-sable.vercel.app,https://talkietiv.com,https://www.talkietiv.com
      - key: MONGODB_URI
        sync: false
